name: DomainZen all-platform prerelease

on:
  workflow_dispatch:
    inputs:
      disable_pgo:
        description: "Skip profile-guided optimization (faster build, slightly less optimized)"
        required: true
        type: boolean
        default: true

# The upstream reusable release workflow contains jobs that request broad
# permissions (including write-all). A caller cannot grant less permission
# than those jobs request, so this must match the reusable workflow's needs.
permissions: write-all

jobs:
  build:
    name: Build DomainZen for Windows, macOS, and Linux
    uses: ./.github/workflows/build.yml
    with:
      create_release: true
      update_version: false
      update_branch: twilight
      use-sccache: false
      disable-pgo: ${{ inputs.disable_pgo }}
      regenerate-pgo: false
    secrets: inherit
